name: PR Version Bump

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  bump-frontend-version:
    # Forked PRs do not have permission to push back with GITHUB_TOKEN.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump frontend patch version
        run: npm --prefix frontend version patch --no-git-tag-version

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/package.json frontend/package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore: bump frontend version for PR #${{ github.event.pull_request.number }}"
          git push
